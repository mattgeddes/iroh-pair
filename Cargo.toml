[package]
name = "iroh-pair"
version = "0.8.3"
edition = "2021"
license = "MIT"
description = "An Iroh Protocol that implements simple pairing between devices and exchange of a small amount of data, such as long-term public key material."
repository = "https://github.com/mattgeddes/iroh-pair"
homepage = "https://incomplete.io/projects/iroh-pair"
keywords = ["iroh", "p2p", "security", "pairing", "key-exchange"]
authors = ["Matthew Geddes"]

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
anyhow = "1"

[[example]]
name = "cli"
path = "examples/cli.rs"
